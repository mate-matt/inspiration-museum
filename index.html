<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>灵感博物馆</title>
  <meta name="description" content="better input → better output · 匠人输入源">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    try {
      if (localStorage.getItem("im-theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", "#000000");
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="titles">
        <h1>灵感博物馆</h1>
        <p class="subtitle">better input → better output · 匠人输入源</p>
        <p class="count" id="count"></p>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-pressed="false" aria-label="切换到深色">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 3.1a8.8 8.8 0 1 0 5.4 12.2A8 8 0 0 1 15.5 3.1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 3.5v1.8M12 18.7v1.8M3.5 12h1.8M18.7 12h1.8M6 6l1.3 1.3M16.7 16.7 18 18M18 6l-1.3 1.3M7.3 16.7 6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="toolbar">
      <div id="filters" class="filters" role="toolbar" aria-label="按分类筛选"></div>
    </div>

    <main id="board">
      <p class="status" id="status">正在读取书目…</p>
    </main>

    <footer class="site-footer">
      <p>私人阅读清单。新增一条：编辑 <code>data/sources.json</code>，推送到 <code>main</code>。</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
